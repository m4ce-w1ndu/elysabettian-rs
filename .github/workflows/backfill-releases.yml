name: Backfill Historical Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Select version to build and release (or "all" for every version)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'v0.1.0'
          - 'v0.2.0'
          - 'v0.3.0'
          - 'v0.4.0'
          - 'v0.5.0'

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set_versions.outputs.versions }}
    steps:
      - name: Resolve target version list
        id: set_versions
        shell: bash
        run: |
          if [ "${{ github.event.inputs.version }}" = "all" ]; then
            echo 'versions=["v0.1.0", "v0.2.0", "v0.3.0", "v0.4.0", "v0.5.0"]' >> $GITHUB_OUTPUT
          else
            echo "versions=[\"${{ github.event.inputs.version }}\"]" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build (${{ matrix.version }} / ${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
        target:
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_name: ely_cli
            package_name: elysabettian-linux-x86_64-musl-static
            use_musl: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: ely_cli
            package_name: elysabettian-linux-x86_64-gnu
            use_musl: false
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: ely_cli
            package_name: elysabettian-macos-arm64
            use_musl: false
          - target: x86_64-apple-darwin
            os: macos-13
            binary_name: ely_cli
            package_name: elysabettian-macos-x86_64
            use_musl: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: ely_cli.exe
            package_name: elysabettian-windows-x86_64
            use_musl: false

    steps:
      - name: Checkout repository at version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.use_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p ely_cli

      - name: Package Release Asset (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE_DIR="${{ matrix.package_name }}-${{ matrix.version }}"
          mkdir -p "${ARCHIVE_DIR}"

          # Provide both 'ely' and 'ely_cli' binaries
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${ARCHIVE_DIR}/ely"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${ARCHIVE_DIR}/ely_cli"
          strip "${ARCHIVE_DIR}/ely" 2>/dev/null || true
          strip "${ARCHIVE_DIR}/ely_cli" 2>/dev/null || true

          # Include license, documentation, and examples if present
          cp README.md LICENSE "${ARCHIVE_DIR}/" 2>/dev/null || true
          cp -r examples "${ARCHIVE_DIR}/" 2>/dev/null || true

          ARCHIVE_FILE="${ARCHIVE_DIR}.tar.gz"
          tar -czf "${ARCHIVE_FILE}" "${ARCHIVE_DIR}"
          sha256sum "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"

          echo "ASSET_ARCHIVE=${ARCHIVE_FILE}" >> $GITHUB_ENV
          echo "ASSET_SHA=${ARCHIVE_FILE}.sha256" >> $GITHUB_ENV

      - name: Package Release Asset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE_DIR="${{ matrix.package_name }}-${{ matrix.version }}"
          mkdir -p "${ARCHIVE_DIR}"

          # Provide both 'ely.exe' and 'ely_cli.exe' binaries
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${ARCHIVE_DIR}/ely.exe"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${ARCHIVE_DIR}/ely_cli.exe"

          # Include license, documentation, and examples if present
          cp README.md LICENSE "${ARCHIVE_DIR}/" 2>/dev/null || true
          cp -r examples "${ARCHIVE_DIR}/" 2>/dev/null || true

          ARCHIVE_FILE="${ARCHIVE_DIR}.zip"
          7z a "${ARCHIVE_FILE}" "${ARCHIVE_DIR}"
          certutil -hashfile "${ARCHIVE_FILE}" SHA256 | grep -v "hash of" | grep -v "CertUtil" | tr -d '\r\n ' > "${ARCHIVE_FILE}.sha256"

          echo "ASSET_ARCHIVE=${ARCHIVE_FILE}" >> $GITHUB_ENV
          echo "ASSET_SHA=${ARCHIVE_FILE}.sha256" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.version }}-${{ matrix.target }}
          path: |
            ${{ env.ASSET_ARCHIVE }}
            ${{ env.ASSET_SHA }}

  publish:
    name: Publish Release (${{ matrix.version }})
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}
          fetch-depth: 0

      - name: Download all built artifacts for version
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          pattern: asset-${{ matrix.version }}-*
          merge-multiple: true

      - name: Generate Global Checksums
        shell: bash
        run: |
          cd release-dist
          sha256sum elysabettian-*.* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.version }}
          name: "Elysabettian ${{ matrix.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/elysabettian-*.tar.gz
            release-dist/elysabettian-*.zip
            release-dist/SHA256SUMS.txt
