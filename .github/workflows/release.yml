name: Release & Distributable Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or release version (e.g. v0.1.0). Leave empty to use current git commit.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 Static Binary (musl - runs on ANY Linux distribution)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: ely_cli
            package_name: elysabettian-linux-x86_64-musl-static
            use_musl: true
          # Linux x86_64 Standard Dynamic (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ely_cli
            package_name: elysabettian-linux-x86_64-gnu
            use_musl: false
          # macOS Apple Silicon (AArch64 - M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ely_cli
            package_name: elysabettian-macos-arm64
            use_musl: false
          # macOS Intel (x86_64)
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: ely_cli
            package_name: elysabettian-macos-x86_64
            use_musl: false
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ely_cli.exe
            package_name: elysabettian-windows-x86_64
            use_musl: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.use_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Resolve Version Name
        id: resolve_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="nightly-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Resolved version: ${VERSION}"

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p ely_cli

      - name: Package Release Asset (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE_DIR="${{ matrix.package_name }}-${{ env.VERSION }}"
          mkdir -p "${ARCHIVE_DIR}"

          # Provide both 'ely' and 'ely_cli' binaries
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${ARCHIVE_DIR}/ely"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${ARCHIVE_DIR}/ely_cli"
          strip "${ARCHIVE_DIR}/ely" 2>/dev/null || true
          strip "${ARCHIVE_DIR}/ely_cli" 2>/dev/null || true

          # Include license, documentation, and benchmark examples
          cp README.md LICENSE "${ARCHIVE_DIR}/" 2>/dev/null || true
          cp -r examples "${ARCHIVE_DIR}/" 2>/dev/null || true

          ARCHIVE_FILE="${ARCHIVE_DIR}.tar.gz"
          tar -czf "${ARCHIVE_FILE}" "${ARCHIVE_DIR}"
          sha256sum "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"

          echo "ASSET_ARCHIVE=${ARCHIVE_FILE}" >> $GITHUB_ENV
          echo "ASSET_SHA=${ARCHIVE_FILE}.sha256" >> $GITHUB_ENV

      - name: Package Release Asset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE_DIR="${{ matrix.package_name }}-${{ env.VERSION }}"
          mkdir -p "${ARCHIVE_DIR}"

          # Provide both 'ely.exe' and 'ely_cli.exe' binaries
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${ARCHIVE_DIR}/ely.exe"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${ARCHIVE_DIR}/ely_cli.exe"

          # Include license, documentation, and benchmark examples
          cp README.md LICENSE "${ARCHIVE_DIR}/" 2>/dev/null || true
          cp -r examples "${ARCHIVE_DIR}/" 2>/dev/null || true

          ARCHIVE_FILE="${ARCHIVE_DIR}.zip"
          7z a "${ARCHIVE_FILE}" "${ARCHIVE_DIR}"
          certutil -hashfile "${ARCHIVE_FILE}" SHA256 | grep -v "hash of" | grep -v "CertUtil" | tr -d '\r\n ' > "${ARCHIVE_FILE}.sha256"

          echo "ASSET_ARCHIVE=${ARCHIVE_FILE}" >> $GITHUB_ENV
          echo "ASSET_SHA=${ARCHIVE_FILE}.sha256" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: |
            ${{ env.ASSET_ARCHIVE }}
            ${{ env.ASSET_SHA }}

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Resolve Version Name
        id: resolve_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="nightly-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          pattern: asset-*
          merge-multiple: true

      - name: Generate Global Checksums
        shell: bash
        run: |
          cd release-dist
          sha256sum elysabettian-*.* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Elysabettian ${{ env.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/elysabettian-*.tar.gz
            release-dist/elysabettian-*.zip
            release-dist/SHA256SUMS.txt
